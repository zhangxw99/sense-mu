# sense-mu same-origin 路由：前端只认同源相对路径，具体服务地址全部在这里解耦
server {
    listen 80;
    server_name _;

    # 数据集分片上传等大请求（前端上传超时 120s 约定）
    client_max_body_size 200m;

    # sz-boot 后端：/sz-api/* → 宿主 9991 的 /api/*（deploy-bundle compose 已发布 0.0.0.0:9991）
    location /sz-api/ {
        proxy_pass http://host.docker.internal:9991/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 其余全部进前端 SSR（/edge-agent /edge-api /sam-api 等边缘路径当前在云端无目标，
    # 会由前端应用返回 404——边缘服务在设备侧，云端不可直连，属预期）
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
