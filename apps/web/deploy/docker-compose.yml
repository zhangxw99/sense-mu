# dev1 前端栈：nginx(80) 做 same-origin 路由 → web(3000) SSR / 后端(9991) API
services:
  web:
    build:
      context: ./artifact
      dockerfile: ../Dockerfile.web
    image: sensemu-web:dev
    container_name: sensemu-web
    restart: always
    environment:
      TZ: Asia/Shanghai
    # 不发布宿主端口，仅经 nginx 对外
    expose:
      - "3000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/__sensemu/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: sensemu-nginx
    restart: always
    depends_on:
      web:
        condition: service_started
    extra_hosts:
      # Linux 上让 nginx 容器可访问宿主端口（后端 9991 发布在 0.0.0.0）
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
